<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' · Mural IFC Rio do Sul'">Mural IFC Rio do Sul</title>
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/images/ifc-favicon.png}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="site-header" th:fragment="header">
    <a class="skip-link" href="#conteudo">Ir para o conteúdo</a>
    <div class="header-inner">
        <a class="brand" th:href="@{/}" aria-label="Mural estudantil — página inicial"><img class="brand-logo" th:src="@{/images/ifc-riodosul-horizontal.png}" alt="Instituto Federal Catarinense — Campus Rio do Sul" width="828" height="275"><span class="brand-caption">Mural estudantil<small>CURSOS · DESENVOLVIMENTO WEB II</small></span></a>
        <nav aria-label="Navegação principal">
            <a th:href="@{/}">Mural público</a>
            <th:block th:if="${usuario != null}">
                <a th:href="@{/painel}">Painel</a>
                <a th:href="@{/noticias}">Notícias</a>
                <a th:href="@{/contas}">Contas</a>
                <a th:if="${usuario.administrador()}" th:href="@{/usuarios}">Usuários</a>
                <form th:action="@{/logout}" method="post"><button class="button button-small button-secondary" type="submit">Sair</button></form>
            </th:block>
            <a th:unless="${usuario != null}" class="button button-small" th:href="@{/login}">Acessar sistema <span aria-hidden="true">↗</span></a>
        </nav>
    </div>
    <div class="tenant-bar" th:if="${usuario != null}">
        <div class="header-inner"><span>Curso ativo <strong th:text="${usuario.empresaNome()}"></strong></span><span><span th:text="${usuario.nome()}"></span> <span class="badge" th:text="${usuario.administrador() ? 'Administrador' : 'Usuário comum'}"></span></span></div>
    </div>
</header>
<div th:fragment="messages" aria-live="polite">
    <div class="alert alert-success" th:if="${sucesso}" th:text="${sucesso}"></div>
    <div class="alert alert-error" th:if="${erro}" th:text="${erro}" role="alert"></div>
</div>
<footer th:fragment="footer" class="site-footer">
    <a class="footer-brand" href="https://riodosul.ifc.edu.br/" aria-label="Site oficial do IFC Campus Rio do Sul"><img th:src="@{/images/ifc-riodosul-horizontal.png}" alt="Instituto Federal Catarinense — Campus Rio do Sul" width="828" height="275" loading="lazy"></a>
    <div class="footer-copy"><span>IFC Rio do Sul · Ciência da Computação · Desenvolvimento Web II</span><span>Projeto acadêmico não oficial · Dados de demonstração</span></div>
</footer>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Contas')}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main id="conteudo" tabindex="-1" class="container workspace">
    <div class="section-heading"><div class="page-heading"><span class="eyebrow">FINANCEIRO DO CURSO</span><h1>Contas dos projetos</h1><p th:text="${usuario.empresaNome()}"></p></div><a class="button" th:href="@{/contas/nova}">+ Nova conta</a></div>
    <div th:replace="~{fragments :: messages}"></div>
    <div class="panel table-wrap"><table><thead><tr><th>Descrição</th><th>Tipo</th><th>Valor</th><th>Vencimento</th><th>Situação</th><th>Ações</th></tr></thead><tbody>
        <tr th:if="${#lists.isEmpty(contas)}"><td colspan="6" class="empty-state">Nenhuma conta cadastrada neste curso.</td></tr>
        <tr th:each="conta : ${contas}"><td><strong th:text="${conta.descricao()}"></strong></td><td th:text="${conta.tipo() == 'PAGAR' ? 'A pagar' : 'A receber'}"></td><td class="nowrap" th:text="'R$ ' + ${#numbers.formatDecimal(conta.valor(), 1, 'POINT', 2, 'COMMA')}"></td><td th:text="${#temporals.format(conta.vencimento(), 'dd/MM/yyyy')}"></td><td><span class="badge" th:classappend="${conta.situacao() == 'PAGA' ? 'badge-green' : 'badge-amber'}" th:text="${conta.situacao() == 'PAGA' ? 'Liquidada' : 'Pendente'}"></span></td><td><div class="actions"><a class="button button-small button-secondary" th:href="@{/contas/{id}/editar(id=${conta.id()})}">Editar</a><form th:action="@{/contas/{id}/excluir(id=${conta.id()})}" method="post"><button class="button button-small button-danger" type="submit">Excluir</button></form></div></td></tr>
    </tbody></table></div>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
